name: Scalper Scheduler

on:
  schedule:
    # 평일 09:00~15:30 KST = UTC 00:00~06:30
    # 10분마다 실행
    - cron: '*/10 0-6 * * 1-5'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-scalper:
    runs-on: ubuntu-latest
    steps:
      - name: Check market is open (KST 09:00–15:30, 공휴일 제외)
        id: check
        run: |
          KST_DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          TOTAL_MIN=$(TZ=Asia/Seoul date +%H%M | awk '{h=substr($0,1,2); m=substr($0,3,2); print h*60+m}')

          HOLIDAYS="
            2025-01-01 2025-01-28 2025-01-29 2025-01-30
            2025-03-01 2025-05-05 2025-05-06 2025-05-15
            2025-06-06 2025-08-15 2025-10-03 2025-10-06
            2025-10-07 2025-10-08 2025-10-09 2025-12-25 2025-12-31
            2026-01-01 2026-02-16 2026-02-17 2026-02-18
            2026-03-01 2026-05-05 2026-05-25 2026-06-06
            2026-08-15 2026-09-24 2026-09-25 2026-09-26
            2026-10-03 2026-10-09 2026-12-25 2026-12-31
          "

          if echo "$HOLIDAYS" | grep -qw "$KST_DATE"; then
            echo "오늘은 공휴일($KST_DATE) — 실행 건너뜀"
            echo "open=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$TOTAL_MIN" -ge 540 ] && [ "$TOTAL_MIN" -lt 930 ]; then
            echo "open=true" >> $GITHUB_OUTPUT
          else
            echo "open=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Scalper
        if: steps.check.outputs.open == 'true'
        run: |
          curl -s -X POST "${{ secrets.APP_URL }}/api/scalper" \
            -H "Content-Type: application/json" \
            --max-time 65 || echo "scalper timeout/error (ignored)"
