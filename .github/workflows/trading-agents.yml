name: AI 에이전트
# KST 09:00~15:30 = UTC 00:00~06:30, 평일 15분마다

on:
  schedule:
    - cron: '0,15,30,45 0-5 * * 1-5'
    - cron: '0,15 6 * * 1-5'
  workflow_dispatch:

jobs:
  ai-agent:
    name: AI 에이전트
    runs-on: ubuntu-latest
    steps:
      - name: Run AI Agent
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "https://stock-sim-gules.vercel.app/api/cron/agent" \
            -H "Authorization: Bearer ${{ secrets.CRON_KEY }}")
          echo "AI Agent response: $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "::warning::AI Agent returned HTTP $RESPONSE"
          fi
